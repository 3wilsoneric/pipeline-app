name: Pipeline CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.impact.outputs.browser }}
      postgres: ${{ steps.impact.outputs.postgres }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: impact
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-change-impact.mjs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Run the complete non-browser contract gate
        run: npm run check:platform:fast
      - name: Build the production artifact once
        run: npm run build
      - run: npm run check:artifacts
      - run: npm run release:evidence -- --out-dir /tmp/pipeline-release-evidence
      - run: PIPELINE_REQUIRE_CLEAN_RELEASE=true npm run release:evidence:verify -- --dir /tmp/pipeline-release-evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pipeline-release-evidence
          path: /tmp/pipeline-release-evidence
          retention-days: 30

  browser:
    needs: [changes, verify]
    if: github.event_name != 'pull_request' && needs.changes.outputs.browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HOME: /root
    container:
      image: mcr.microsoft.com/playwright@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48 # v1.61.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the browser-test artifact
        run: npm run build
      - name: Run primary browser journeys
        shell: bash
        env:
          HOSTNAME: 127.0.0.1
          PORT: 3000
          PIPELINE_AUTH_MODE: mock
          PIPELINE_ALLOW_PRODUCTION_MOCK_AUTH: "true"
          PIPELINE_EXTRACTION_BACKEND: mock
          PIPELINE_ALLOW_PRODUCTION_MOCK_EXTRACTION: "true"
          PIPELINE_MOCK_USER_EMAIL: playwright@pipeline.local
          PIPELINE_MOCK_USER_NAME: Playwright QA
          PIPELINE_ADMIN_EMAILS: playwright@pipeline.local
          PIPELINE_ALLOWED_EMAILS: playwright@pipeline.local
          PIPELINE_ALLOWED_MUTATION_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
          PIPELINE_ALLOW_LOCAL_REFERRAL_STORE: "true"
          PIPELINE_REFERRAL_STORE_PATH: .data/playwright/referrals-3000.json
          PIPELINE_ASSESSMENT_STORE_PATH: .data/playwright/assessments-3000.json
          PIPELINE_RESIDENT_LINK_STORE_PATH: .data/playwright/resident-links-3000.json
          PIPELINE_LOCAL_DOCUMENT_ROOT: .data/playwright/documents-3000
          PIPELINE_ENABLE_SYNTHETIC_PROFILES: "true"
          PIPELINE_WORKER_SHARED_SECRET: playwright-worker-secret
        run: |
          set -euo pipefail
          node scripts/start-standalone.mjs > /tmp/pipeline-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=false
          for attempt in {1..60}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Pipeline exited before the browser suite started."
              tail -200 /tmp/pipeline-browser-server.log
              exit 1
            fi
            if curl --fail --silent --show-error --output /dev/null \
              http://127.0.0.1:3000/api/health/live; then
              ready=true
              break
            fi
            sleep 1
          done

          if [[ "$ready" != "true" ]]; then
            echo "Pipeline did not become live within 60 seconds."
            tail -200 /tmp/pipeline-browser-server.log
            exit 1
          fi

          PIPELINE_E2E_EXTERNAL_SERVER=true npm run test:e2e
      - name: Enforce Pipeline McMaster certification budget
        run: npm run check:mcmaster && npm run certify:mcmaster:performance
      - run: npm run test:e2e:desktop
      - run: npm run test:e2e:cross-browser
      - name: Enforce Linux visual baselines
        run: npm run test:e2e:visual
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            /tmp/pipeline-browser-server.log
          retention-days: 7

  postgres:
    needs: [changes, verify]
    if: github.event_name != 'pull_request' && needs.changes.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pipeline_ci
          POSTGRES_PASSWORD: pipeline_ci
          POSTGRES_DB: pipeline_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline_ci -d pipeline_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PIPELINE_DATABASE_URL: postgresql://pipeline_ci:pipeline_ci@127.0.0.1:5432/pipeline_ci
      PIPELINE_TEST_DATABASE_URL: postgresql://pipeline_ci:pipeline_ci@127.0.0.1:5432/pipeline_ci
      PIPELINE_DATABASE_SSL_MODE: disable
      PIPELINE_DATABASE_MODE: postgres
      PIPELINE_REFERRAL_STORE_MODE: postgres
      PIPELINE_ASSESSMENT_STORE_MODE: postgres
      PIPELINE_RESIDENT_LINK_STORE_MODE: postgres
      PIPELINE_ALLOW_TEST_DATABASE_REUSE: "true"
      PIPELINE_ALLOW_MIGRATION_ROLLBACK_DRILL: "true"
      PIPELINE_AUTH_MODE: headers
      PIPELINE_TRUSTED_GATEWAY: "true"
      PIPELINE_ALLOWED_EMAILS: pipeline-load-user-1@example.invalid,pipeline-load-user-2@example.invalid,pipeline-load-user-3@example.invalid,pipeline-load-user-4@example.invalid,pipeline-load-user-5@example.invalid,pipeline-load-user-6@example.invalid,pipeline-load-user-7@example.invalid,pipeline-load-user-8@example.invalid,pipeline-load-user-9@example.invalid,pipeline-load-user-10@example.invalid
      PIPELINE_ADMIN_EMAILS: pipeline-load-user-1@example.invalid,pipeline-load-user-2@example.invalid,pipeline-load-user-3@example.invalid,pipeline-load-user-4@example.invalid,pipeline-load-user-5@example.invalid,pipeline-load-user-6@example.invalid,pipeline-load-user-7@example.invalid,pipeline-load-user-8@example.invalid,pipeline-load-user-9@example.invalid,pipeline-load-user-10@example.invalid
      PIPELINE_EXTRACTION_BACKEND: mock
      PIPELINE_ALLOW_PRODUCTION_MOCK_EXTRACTION: "true"
      NEXT_PUBLIC_PIPELINE_DESKTOP_ENABLED: "true"
      PIPELINE_DESKTOP_STATE_ENABLED: "true"
      PORT: "3191"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run database:migrate
      - run: npm run check:database:live
      - run: npm run database:fixtures
      - run: npm run database:query-plans
      - run: npm run database:rollback:drill
      - run: npm run database:seed:production
      - run: npm run build
      - name: Ten-user PostgreSQL contention and load drill
        run: |
          npm run start > /tmp/pipeline-postgres-ci.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --silent --output /dev/null http://127.0.0.1:3191/api/health; then
              break
            fi
            sleep 1
          done
          PIPELINE_COLLABORATION_BASE_URL=http://127.0.0.1:3191 \
          PIPELINE_COLLABORATION_REQUIRE_POSTGRES=true \
          PIPELINE_COLLABORATION_REQUIRE_DESKTOP_STATE=true \
          npm run check:collaboration-load
          PIPELINE_LOAD_BASE_URL=http://127.0.0.1:3191 \
          PIPELINE_LOAD_USER_EMAIL=pipeline-load-user-1@example.invalid \
          PIPELINE_LOAD_REQUESTS=200 \
          npm run check:load
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: postgres-ci-log
          path: /tmp/pipeline-postgres-ci.log
          retention-days: 7
