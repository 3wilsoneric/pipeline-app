name: Pipeline Security

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: read

concurrency:
  group: pipeline-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: vars.PIPELINE_DEPENDENCY_REVIEW_ENABLED == 'true'
        with:
          config-file: ./.github/dependency-review-config.yml
      - name: Record unavailable native dependency review
        if: vars.PIPELINE_DEPENDENCY_REVIEW_ENABLED != 'true'
        run: echo "Native GitHub dependency review is not enabled; the blocking npm audit, license, integrity, CodeQL, and platform gates still run."

  codeql:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: github/codeql-action/init@f411752efdf656cb71aa17b755b22c890960da1d # v3.35.5
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@f411752efdf656cb71aa17b755b22c890960da1d # v3.35.5
        with:
          output: codeql-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif
          path: codeql-results
          retention-days: 30
