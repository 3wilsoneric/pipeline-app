name: Deploy Pipeline to Azure

on:
  workflow_dispatch:
    inputs:
      extraction_backend:
        description: Packet processing mode
        required: true
        default: manual
        type: choice
        options:
          - manual
          - azure_databricks
      clinical_data_mode:
        description: Clinical adapter mode
        required: true
        default: alamo_api
        type: choice
        options:
          - disconnected
          - alamo_api
      enable_clinical_reconcile_job:
        description: Enable the metered daily clinical reconciliation job
        required: true
        default: false
        type: boolean
      enable_retention_job:
        description: Run the approved daily retention policy
        required: true
        default: true
        type: boolean
      enable_note_lab:
        description: Enable the supervisor-only Assessment Language Lab
        required: true
        default: true
        type: boolean
      enable_meet_client_mail:
        description: Enable Microsoft 365 Meet the Client summary and packet delivery
        required: true
        default: false
        type: boolean
      enable_meet_client_large_packets:
        description: Enable large packet upload sessions after Mail.ReadWrite admin consent
        required: true
        default: false
        type: boolean
      initial_database_bootstrap:
        description: One-time only - create database roles on the first deployment
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: pipeline-production-deployment
  cancel-in-progress: false

env:
  FOUNDATION_DEPLOYMENT_NAME: pipeline-foundation-state
  IMAGE_NAME: pipeline-app

jobs:
  deploy:
    name: Build and deploy immutable Azure revision
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@93381592711f247e165c389ebb30b596c84cdc48 # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Read deployment-owned Azure resource names
        id: foundation
        shell: bash
        run: |
          set -euo pipefail
          outputs="$(az deployment group show \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --name "$FOUNDATION_DEPLOYMENT_NAME" \
            --query properties.outputs \
            --output json)"
          test -n "$outputs"
          echo "name_prefix=$(jq -r '.namePrefix.value' <<<"$outputs")" >> "$GITHUB_OUTPUT"
          echo "environment=$(jq -r '.environment.value' <<<"$outputs")" >> "$GITHUB_OUTPUT"
          echo "location=$(jq -r '.location.value' <<<"$outputs")" >> "$GITHUB_OUTPUT"
          echo "registry_name=$(jq -r '.containerRegistryName.value' <<<"$outputs")" >> "$GITHUB_OUTPUT"
          echo "registry_server=$(jq -r '.containerRegistryLoginServer.value' <<<"$outputs")" >> "$GITHUB_OUTPUT"
          echo "container_environment_id=$(jq -r '.containerAppsEnvironmentId.value' <<<"$outputs")" >> "$GITHUB_OUTPUT"
          echo "runtime_identity_id=$(jq -r '.runtimeIdentityResourceId.value' <<<"$outputs")" >> "$GITHUB_OUTPUT"
          echo "runtime_identity_client_id=$(jq -r '.runtimeIdentityClientId.value' <<<"$outputs")" >> "$GITHUB_OUTPUT"
          echo "key_vault_uri=$(jq -r '.keyVaultUri.value' <<<"$outputs")" >> "$GITHUB_OUTPUT"
          echo "storage_account=$(jq -r '.storageAccountName.value' <<<"$outputs")" >> "$GITHUB_OUTPUT"
          echo "alert_action_group_ids=$(jq -c '.alertActionGroupResourceIds.value // []' <<<"$outputs")" >> "$GITHUB_OUTPUT"

      - name: Preserve existing custom hostname bindings
        id: custom-domains
        shell: bash
        run: |
          set -euo pipefail
          web_name="$(printf '%s-%s-web' \
            '${{ steps.foundation.outputs.name_prefix }}' \
            '${{ steps.foundation.outputs.environment }}' | cut -c1-32)"
          if az containerapp show \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --name "$web_name" \
            --output none 2>/dev/null; then
            custom_domains="$(az containerapp show \
              --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
              --name "$web_name" \
              --query 'properties.configuration.ingress.customDomains' \
              --output json | jq -c '. // []')"
          else
            custom_domains='[]'
          fi
          echo "json=$custom_domains" >> "$GITHUB_OUTPUT"

      - name: Sign in to Azure Container Registry
        shell: bash
        run: az acr login --name '${{ steps.foundation.outputs.registry_name }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Generate an ephemeral server-action build key
        id: build-key
        shell: bash
        run: |
          set -euo pipefail
          key="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$key"
          echo "value=$key" >> "$GITHUB_OUTPUT"

      - name: Build and push the immutable Pipeline image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.foundation.outputs.registry_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_ENTRA_TENANT_ID=${{ vars.PIPELINE_ENTRA_TENANT_ID }}
            NEXT_PUBLIC_ENTRA_CLIENT_ID=${{ vars.PIPELINE_ENTRA_CLIENT_ID }}
            NEXT_PUBLIC_PIPELINE_API_SCOPE=api://${{ vars.PIPELINE_ENTRA_CLIENT_ID }}/access_as_user
            NEXT_PUBLIC_PIPELINE_AUTH_REQUIRED=true
            NEXT_PUBLIC_PIPELINE_DESKTOP_ENABLED=true
            PIPELINE_DEPLOYMENT_ID=${{ github.sha }}
          secrets: |
            next_server_actions_encryption_key=${{ steps.build-key.outputs.value }}

      - name: Preview runtime infrastructure changes
        shell: bash
        run: |
          set -euo pipefail
          az deployment group what-if \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --name "pipeline-runtime-${GITHUB_RUN_ID}" \
            --template-file infra/azure/runtime.bicep \
            --parameters \
              namePrefix='${{ steps.foundation.outputs.name_prefix }}' \
              environment='${{ steps.foundation.outputs.environment }}' \
              location='${{ steps.foundation.outputs.location }}' \
              containerImage='${{ steps.foundation.outputs.registry_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}' \
              deploymentId='${{ github.sha }}' \
              containerAppsEnvironmentId='${{ steps.foundation.outputs.container_environment_id }}' \
              containerRegistryLoginServer='${{ steps.foundation.outputs.registry_server }}' \
              runtimeIdentityResourceId='${{ steps.foundation.outputs.runtime_identity_id }}' \
              runtimeIdentityClientId='${{ steps.foundation.outputs.runtime_identity_client_id }}' \
              keyVaultUri='${{ steps.foundation.outputs.key_vault_uri }}' \
              storageAccountName='${{ steps.foundation.outputs.storage_account }}' \
              alertActionGroupResourceIds='${{ steps.foundation.outputs.alert_action_group_ids }}' \
              entraTenantId='${{ vars.PIPELINE_ENTRA_TENANT_ID }}' \
              pipelineEntraClientId='${{ vars.PIPELINE_ENTRA_CLIENT_ID }}' \
              customDomains='${{ steps.custom-domains.outputs.json }}' \
              extractionBackend='${{ inputs.extraction_backend }}' \
              databricksHost='${{ vars.PIPELINE_DATABRICKS_HOST }}' \
              databricksJobId='${{ vars.PIPELINE_DATABRICKS_JOB_ID }}' \
              databricksClientId='${{ vars.PIPELINE_DATABRICKS_CLIENT_ID }}' \
              clinicalDataMode='${{ inputs.clinical_data_mode }}' \
              alamoApiBaseUrl='${{ vars.PIPELINE_ALAMO_API_BASE_URL }}' \
              alamoTenantId='${{ vars.PIPELINE_ALAMO_TENANT_ID }}' \
              alamoClientId='${{ vars.PIPELINE_ALAMO_CLIENT_ID }}' \
              alamoApiScope='${{ vars.PIPELINE_ALAMO_API_SCOPE }}' \
              enableMeetClientMail='${{ inputs.enable_meet_client_mail }}' \
              graphMailClientId='${{ vars.PIPELINE_GRAPH_MAIL_CLIENT_ID }}' \
              meetClientSender='${{ vars.PIPELINE_MEET_CLIENT_SENDER }}' \
              meetClientAllowedEmailDomains='${{ vars.PIPELINE_MEET_CLIENT_ALLOWED_EMAIL_DOMAINS }}' \
              enableMeetClientLargePackets='${{ inputs.enable_meet_client_large_packets }}' \
              enableClinicalReconcileJob='${{ inputs.enable_clinical_reconcile_job }}' \
              enableRetentionJob='${{ inputs.enable_retention_job }}' \
              enableNoteLab='${{ inputs.enable_note_lab }}' \
              initialDatabaseBootstrap='${{ inputs.initial_database_bootstrap }}'

      - name: Deploy runtime and scheduled jobs
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --name pipeline-runtime \
            --template-file infra/azure/runtime.bicep \
            --parameters \
              namePrefix='${{ steps.foundation.outputs.name_prefix }}' \
              environment='${{ steps.foundation.outputs.environment }}' \
              location='${{ steps.foundation.outputs.location }}' \
              containerImage='${{ steps.foundation.outputs.registry_server }}/${{ env.IMAGE_NAME }}:${{ github.sha }}' \
              deploymentId='${{ github.sha }}' \
              containerAppsEnvironmentId='${{ steps.foundation.outputs.container_environment_id }}' \
              containerRegistryLoginServer='${{ steps.foundation.outputs.registry_server }}' \
              runtimeIdentityResourceId='${{ steps.foundation.outputs.runtime_identity_id }}' \
              runtimeIdentityClientId='${{ steps.foundation.outputs.runtime_identity_client_id }}' \
              keyVaultUri='${{ steps.foundation.outputs.key_vault_uri }}' \
              storageAccountName='${{ steps.foundation.outputs.storage_account }}' \
              alertActionGroupResourceIds='${{ steps.foundation.outputs.alert_action_group_ids }}' \
              entraTenantId='${{ vars.PIPELINE_ENTRA_TENANT_ID }}' \
              pipelineEntraClientId='${{ vars.PIPELINE_ENTRA_CLIENT_ID }}' \
              customDomains='${{ steps.custom-domains.outputs.json }}' \
              extractionBackend='${{ inputs.extraction_backend }}' \
              databricksHost='${{ vars.PIPELINE_DATABRICKS_HOST }}' \
              databricksJobId='${{ vars.PIPELINE_DATABRICKS_JOB_ID }}' \
              databricksClientId='${{ vars.PIPELINE_DATABRICKS_CLIENT_ID }}' \
              clinicalDataMode='${{ inputs.clinical_data_mode }}' \
              alamoApiBaseUrl='${{ vars.PIPELINE_ALAMO_API_BASE_URL }}' \
              alamoTenantId='${{ vars.PIPELINE_ALAMO_TENANT_ID }}' \
              alamoClientId='${{ vars.PIPELINE_ALAMO_CLIENT_ID }}' \
              alamoApiScope='${{ vars.PIPELINE_ALAMO_API_SCOPE }}' \
              enableMeetClientMail='${{ inputs.enable_meet_client_mail }}' \
              graphMailClientId='${{ vars.PIPELINE_GRAPH_MAIL_CLIENT_ID }}' \
              meetClientSender='${{ vars.PIPELINE_MEET_CLIENT_SENDER }}' \
              meetClientAllowedEmailDomains='${{ vars.PIPELINE_MEET_CLIENT_ALLOWED_EMAIL_DOMAINS }}' \
              enableMeetClientLargePackets='${{ inputs.enable_meet_client_large_packets }}' \
              enableClinicalReconcileJob='${{ inputs.enable_clinical_reconcile_job }}' \
              enableRetentionJob='${{ inputs.enable_retention_job }}' \
              enableNoteLab='${{ inputs.enable_note_lab }}' \
              initialDatabaseBootstrap='${{ inputs.initial_database_bootstrap }}' \
            --query properties.outputs \
            --output json > runtime-outputs.json
          echo "application_url=$(jq -r '.applicationUrl.value' runtime-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "liveness_url=$(jq -r '.livenessUrl.value' runtime-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "readiness_url=$(jq -r '.readinessUrl.value' runtime-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "database_bootstrap_job=$(jq -r '.databaseBootstrapJobName.value' runtime-outputs.json)" >> "$GITHUB_OUTPUT"
          echo "database_migration_job=$(jq -r '.databaseMigrationJobName.value' runtime-outputs.json)" >> "$GITHUB_OUTPUT"

      - name: Apply checksum-guarded database changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.initial_database_bootstrap }}' == 'true' ]]; then
            job='${{ steps.runtime.outputs.database_bootstrap_job }}'
          else
            job='${{ steps.runtime.outputs.database_migration_job }}'
          fi
          az containerapp job start \
            --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
            --name "$job" \
            --output none
          for attempt in {1..90}; do
            status="$(az containerapp job execution list \
              --resource-group '${{ vars.AZURE_RESOURCE_GROUP }}' \
              --name "$job" \
              --query 'sort_by(@,&properties.startTime)[-1].properties.status' \
              --output tsv)"
            if [[ "$status" == "Succeeded" ]]; then
              break
            fi
            if [[ "$status" == "Failed" || "$status" == "Stopped" || "$status" == "Degraded" ]]; then
              echo "The database job failed with status $status." >&2
              exit 1
            fi
            if [[ "$attempt" == 90 ]]; then
              echo "The database job did not finish within 15 minutes." >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify deployed revision health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 '${{ steps.runtime.outputs.liveness_url }}' > /dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              echo "The deployed revision never became live." >&2
              exit 1
            fi
            sleep 10
          done
          curl --fail --silent --show-error --max-time 15 '${{ steps.runtime.outputs.readiness_url }}' > /dev/null
          echo "Pipeline deployed at ${{ steps.runtime.outputs.application_url }}"
