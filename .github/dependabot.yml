version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "14:00"
      timezone: America/Boise
    # Routine version upgrades are reviewed and batched manually. Security
    # alerts and the blocking npm audit remain enabled independently.
    open-pull-requests-limit: 0
    versioning-strategy: increase-if-necessary
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "14:30"
      timezone: America/Boise
    open-pull-requests-limit: 0
