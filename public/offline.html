<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'" />
    <title>Pipeline is offline</title>
    <style>
      :root { color: #111; background: #fff; font-family: Arial, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
      main { width: min(520px, calc(100% - 48px)); }
      strong { color: #118c78; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase; }
      h1 { margin: 24px 0 12px; font-size: clamp(32px, 7vw, 54px); line-height: 1.05; }
      p { margin: 0; color: #5f6563; font-size: 17px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main>
      <strong>Pipeline</strong>
      <h1>A connection is required.</h1>
      <p>Reconnect to reopen Pipeline. An assessment already open can keep working offline; encrypted changes sync when the connection returns.</p>
    </main>
  </body>
</html>
